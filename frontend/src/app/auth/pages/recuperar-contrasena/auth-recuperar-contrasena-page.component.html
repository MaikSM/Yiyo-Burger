<div
  class="min-h-[70vh] flex items-center justify-center bg-gray-900 py-2 px-4"
>
  <div
    class="w-full max-w-sm bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700"
  >
    <!-- Título -->
    <h2 class="text-3xl font-bold text-center text-orange-500 mb-8">
      Recuperar Contraseña
    </h2>

    <!-- Instrucciones -->
    <p class="text-gray-400 text-center mb-6">
      Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
    </p>

    <!-- Formulario -->
    <form class="space-y-6" [formGroup]="recoveryForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2" for="email">
          Correo Electrónico
        </label>
        <input
          type="email"
          placeholder="tu@email.com"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all duration-300"
          formControlName="email"
        />
      </div>

      <!-- Botón Submit -->
      <button
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105"
        type="submit"
      >
        Enviar
      </button>
    </form>

    <!-- Enlace a Login -->
    <div class="text-center mt-4">
      <a
        routerLink="/auth/login"
        class="text-sm font-medium text-orange-500 hover:text-orange-400 transition-colors duration-300"
        >Volver al Login</a>
    </div>
  </div>
</div>
