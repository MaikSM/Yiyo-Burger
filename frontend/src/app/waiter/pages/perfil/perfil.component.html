<div class="max-w-2xl mx-auto space-y-6">
  <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
    <div class="flex items-center gap-4 mb-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-3xl shadow-lg">
        👤
      </div>
      <div>
        <h1 class="text-xl font-black text-white">
          {{ authService.user()?.name }} {{ authService.user()?.surname || '' }}
        </h1>
        <p class="text-xs text-orange-400 font-bold uppercase tracking-wider mt-0.5">
          Rol: Mesero / Atención en Mesa
        </p>
      </div>
    </div>

    <div class="space-y-3 divide-y divide-gray-800 text-xs">
      <div class="pt-2 flex justify-between">
        <span class="text-gray-400">Correo Electrónico:</span>
        <span class="text-gray-200 font-medium">{{ authService.user()?.email }}</span>
      </div>
      <div class="pt-3 flex justify-between">
        <span class="text-gray-400">ID de Usuario:</span>
        <span class="text-gray-200 font-mono font-medium">#{{ authService.user()?.id }}</span>
      </div>
      <div class="pt-3 flex justify-between">
        <span class="text-gray-400">Estado de Cuenta:</span>
        <span class="text-emerald-400 font-bold">Activo</span>
      </div>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-800 flex gap-3">
      <button
        (click)="logout()"
        class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"
      >
        <span>🚪</span>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</div>
